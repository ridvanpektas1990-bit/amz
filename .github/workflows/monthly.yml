name: Monthly ETL (SaaS)

# Fee-ETL deaktiviert. Monatlicher Orders-Catch-up bleibt manuell startbar.
# Schedule aus — Nightly Orders + Order-Items-Report decken den Dauerbetrieb.

on:
  workflow_dispatch:
    inputs:
      period_year:  { type: string, required: false, description: "YYYY" }
      period_month: { type: string, required: false, description: "M oder MM" }
      tenants:      { type: string, required: false, description: "CSV oder ALL; leer = ACTIVE_TENANTS" }
      which:        { type: choice,  required: false, default: orders, options: [orders, fees, beides] }

permissions:
  contents: read
  actions: write

jobs:
  call:
    uses: ./.github/workflows/_saas-etl.yml
    with:
      period_year:  ${{ inputs.period_year }}
      period_month: ${{ inputs.period_month }}
      tenants:      ${{ inputs.tenants || vars.ACTIVE_TENANTS || 'ALL' }}
      which:        ${{ inputs.which || 'orders' }}
      max_parallel: 1
    secrets: inherit
