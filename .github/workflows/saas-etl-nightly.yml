name: SaaS ETL (nightly)

on:
  # Täglich um 02:12 UTC — Orders rolling 7 Tage (keine Fees, kein Monats-Vollscan).
  schedule:
    - cron: "12 2 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Orders Lookback in Tagen (1..30)"
        required: false
        default: "7"

permissions:
  contents: read
  actions: write

jobs:
  prep-now:
    runs-on: ubuntu-latest
    outputs:
      year: ${{ steps.now.outputs.year }}
      month: ${{ steps.now.outputs.month }}
    steps:
      - id: now
        shell: bash
        run: |
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%-m)" >> "$GITHUB_OUTPUT"

  etl-rolling:
    needs: prep-now
    uses: ./.github/workflows/_saas-etl.yml
    secrets: inherit
    with:
      period_year: ${{ needs.prep-now.outputs.year }}
      period_month: ${{ needs.prep-now.outputs.month }}
      tenants: ${{ vars.ACTIVE_TENANTS || 'ALL' }}
      which: "orders"
      max_parallel: "1"
      lookback_days: ${{ github.event.inputs.lookback_days || '7' }}
